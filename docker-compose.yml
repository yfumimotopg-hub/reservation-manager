services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservation-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=reservation
      - DB_USER=app_user
      - DB_PASSWORD=app_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: reservation-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=reservation
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: